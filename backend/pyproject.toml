[project]
name = "auto-scoring-backend"
version = "0.1.0"
description = "Auto-Scoring Python sidecar (MVP 0.2 base)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2.0",
    "fastapi[standard]>=0.115,<1.0",
    "pydantic>=2.10,<3.0",
    "pypdf>=6.16",
    "pypdfium2>=5.13",
    "sqlalchemy>=2.0,<3.0",
]

[project.scripts]
auto-scoring-sidecar = "auto_scoring.api.sidecar:main"
auto-scoring-openapi = "auto_scoring.api.openapi_schema:main"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    # PoC 3 evidence measurement and sample generation.
    "pillow>=12.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_scoring"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "poc"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["auto_scoring", "poc"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "poc"]

[[tool.mypy.overrides]]
# pypdfium2 ships only partial inline types; pin the boundary here.
module = ["pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Put the backend root on sys.path so the PoC harness (`poc/`, not shipped in the
# wheel) is importable from tests alongside the installed `auto_scoring` package.
pythonpath = ["."]
