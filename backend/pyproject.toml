[project]
name = "auto-scoring-backend"
version = "0.1.0"
description = "Auto-Scoring Python sidecar (MVP 0.2 base)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2.0",
    "fastapi[standard]>=0.115,<1.0",
    # Vertex AI AI-grading adapter (Issue #35): Gemini API keys are blocked
    # by organization policy, so the only way in is Application Default
    # Credentials. Only the credential/token half of the Google stack is
    # needed -- the Vertex AI call itself is plain HTTP over the httpx below
    # (`adapters/ai_grading/_google_adc.py`), so no vendor SDK is added.
    "google-auth>=2.35,<3.0",
    # OpenRouter/OpenAI/Vertex AI-grading adapters (Issues #44, #35); already
    # an indirect dependency via fastapi[standard]/starlette's TestClient,
    # declared directly because `adapters/ai_grading/` imports it.
    "httpx>=0.28,<1.0",
    "keyring>=25.7.0",
    "numpy>=2.0",
    "opencv-python-headless>=4.10,<5.0",
    # 添削資料 Excel catalogues of 誤答パターン → 減点量 → 赤入れ案 (Issue
    # #106, `adapters/excel_error_catalog.py`). The real material is 6 `.xls`
    # and 1 `.xlsx`, which are two unrelated formats: the standard library
    # reads neither (`zipfile` opens an `.xlsx` container but not
    # SpreadsheetML; nothing in it touches `.xls`'s OLE2/BIFF binary), and no
    # declared dependency does either. openpyxl is the `.xlsx` half and
    # refuses `.xls` by design; xlrd 2.x is the `.xls` half and refuses
    # `.xlsx`. Neither replaces the other, and dropping `.xls` would drop 6 of
    # the 7 files.
    "openpyxl>=3.1,<4.0",
    "pydantic>=2.9,<3.0",
    "pypdf>=6.16",
    "pypdfium2>=5.13",
    # Annotated-PDF export (Issue #23): renders Japanese comment/score text
    # with an embedded font. pypdf/pypdfium2 have no text-layout or
    # font-embedding API; reportlab is BSD-licensed (no AGPL/commercial-
    # license issue, unlike PyMuPDF -- docs/poc-3-pdf-coordinates.md).
    "reportlab>=4.2,<5.0",
    "sqlalchemy>=2.0,<3.0",
    # See the openpyxl note above -- the `.xls` half of the same pair.
    "xlrd>=2.0,<3.0",
]

[project.scripts]
auto-scoring-sidecar = "auto_scoring.api.sidecar:main"
auto-scoring-openapi = "auto_scoring.api.openapi_schema:main"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    # Runs the 2,300-odd tests across the runner's cores (Issue #433). The
    # default run is a single process on the CI runner's 4 cores, and the
    # suite is thin (slowest test ~5 s, everything else ~0.1 s), so
    # parallelising is the only lever that shortens the 650 s `Backend` job.
    # `--dist loadfile` keeps every test module on one worker, which is what
    # makes the real-sidecar, dynamic-port and app-data-lock tests safe: they
    # never run concurrently with another test from the same file.
    "pytest-xdist>=3.6",
    "ruff>=0.9",
    # PoC 3 evidence measurement and sample generation.
    "pillow>=12.3",
    # Freezes the sidecar into the onedir bundle the Windows installer ships
    # (Issue #24, `pnpm run package:sidecar`, `packaging/auto-scoring-sidecar.spec`).
    # A build tool, never imported by `auto_scoring`, so it stays out of
    # `[project].dependencies` -- shipping it inside its own output would be
    # circular.
    "pyinstaller>=6.11,<7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_scoring"]
# `migrations/` and `alembic.ini` live at the `backend/` project root (outside
# `src/auto_scoring`) for developer convenience (`uv run alembic ...` from
# `backend/`), but `auto_scoring.db.migrator.upgrade` -- which the packaged
# `auto-scoring-sidecar` console script calls on startup -- needs them
# installed *inside* the package too, or a wheel install has no migrations to
# run and the sidecar exits before Uvicorn ever starts (Issue #26 review).
# `db/migrator.py` resolves both this packaged location and the source-tree
# one, preferring whichever exists.
force-include = { "migrations" = "auto_scoring/migrations", "alembic.ini" = "auto_scoring/alembic.ini" }
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Characters this product actually prints on a Japanese answer sheet
# (`domain.pdf_export._KIND_SYMBOLS` / `_UNPLACED_SUFFIX`, Issue #141), not
# typos for their ASCII lookalikes. RUF001-003 flags them as confusable by
# default, and the ASCII characters it suggests are the wrong glyphs for text
# set in Japanese.
# Also 〇: one of the ◎/〇/△ rating symbols the real 添削資料 print in their
# 重要度/頻度 columns (Issue #106). Like the four above it is the glyph the
# material actually uses, not a typo for the Latin "O" ruff suggests.
allowed-confusables = ["×", "＿", "（", "）", "〇"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's parameter-default idiom (`file: UploadFile = File(...)`) intentionally
# calls these in argument defaults; that's how FastAPI recognizes the parameter
# kind, not a mutable-default bug.
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# pypdfium2 ships only partial inline types; pin the boundary here.
module = ["pypdfium2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# opencv-python-headless ships no inline types; pin the boundary here (only
# adapters/image/opencv_preprocessor.py imports cv2).
module = ["cv2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# reportlab ships no inline types; pin the boundary here (only
# adapters/pdf/pdfium_pypdf_engine.py imports it).
module = ["reportlab.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Neither Excel library ships a py.typed marker; pin the boundary here (only
# adapters/excel_error_catalog.py imports them, and it hands the domain plain
# strings, so nothing untyped travels further than that module).
module = ["openpyxl.*", "xlrd.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Live-provider tests (Issue #54) send material to a real, paid OCR/AI
# provider and need credentials, so they are never part of the default run --
# `pytest -m live` opts in explicitly. The cleanup check itself is offline and
# runs by default; this guard is for the paid probe that measures against the
# real services. `tests/test_live_provider_separation.py` pins the exclusion
# so a later edit cannot silently start billing on every push.
#
# `-n auto --dist loadfile` is the Issue #433 speed-up: `-n auto` uses one
# worker per CPU (4 on the CI runner), and `--dist loadfile` gives every test
# module to exactly one worker so tests that bind a real port, take the
# app-data lock or drive a real sidecar never race a sibling in the same
# module. `pytest-xdist` is a dev dependency; `-n0` overrides this back to a
# single process for a serial debug run.
addopts = "-m 'not live' -n auto --dist loadfile"
markers = [
    "live: sends one question's material to a real paid OCR/AI provider (Issue #54); excluded from the default run",
]
