[project]
name = "auto-scoring-backend"
version = "0.1.0"
description = "Auto-Scoring Python sidecar (MVP 0.2 base)"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115,<1.0",
]

[project.scripts]
auto-scoring-sidecar = "auto_scoring.api.sidecar:main"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_scoring"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
