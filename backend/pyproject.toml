[project]
name = "auto-scoring-backend"
version = "0.1.0"
description = "Auto-Scoring Python sidecar (MVP 0.2 base)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2.0",
    "fastapi[standard]>=0.115,<1.0",
    "numpy>=2.0",
    "opencv-python-headless>=4.10,<5.0",
    "pypdf>=6.16",
    "pypdfium2>=5.13",
    "sqlalchemy>=2.0,<3.0",
]

[project.scripts]
auto-scoring-sidecar = "auto_scoring.api.sidecar:main"
auto-scoring-openapi = "auto_scoring.api.openapi_schema:main"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    # PoC 3 evidence measurement and sample generation.
    "pillow>=12.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_scoring"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's parameter-default idiom (`file: UploadFile = File(...)`) intentionally
# calls these in argument defaults; that's how FastAPI recognizes the parameter
# kind, not a mutable-default bug.
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# pypdfium2 ships only partial inline types; pin the boundary here.
module = ["pypdfium2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# opencv-python-headless ships no inline types; pin the boundary here (only
# adapters/image/opencv_preprocessor.py imports cv2).
module = ["cv2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
