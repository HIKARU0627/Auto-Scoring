# Alembic configuration for the Auto-Scoring sidecar.
#
# The database URL is intentionally a placeholder: `auto_scoring.db.migrator`
# sets it per call, and a bare `uv run alembic ...` reads AUTO_SCORING_DB_URL
# (see migrations/env.py). Never commit a real path or credentials here.

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
sqlalchemy.url = sqlite:///app-data/database.sqlite

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
