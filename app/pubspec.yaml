name: auto_scoring_app
description: "Auto-Scoring desktop app (MVP 0.2 base)"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

# Toolchain is pinned: Flutter 3.41.4 (stable) / Dart 3.11.1.
# The exact Flutter revision lives in `.fvmrc` and `.github/workflows/ci.yml`.
environment:
  sdk: ^3.11.1
  flutter: ">=3.41.0 <4.0.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # HTTP client for the sidecar boundary (interceptor-based token injection,
  # timeouts, cancellation). See docs/technology-stack.md §2.
  dio: ^5.7.0

  # OpenAPI-generated sidecar client (dio + built_value). Regenerate with
  # `pnpm run openapi:generate`; never edit by hand. See docs/sidecar-api.md.
  auto_scoring_api:
    path: packages/auto_scoring_api
  file_picker: ^12.2.0

  # dart:ffi allocator, for the one Win32 struct `core/child_process_group.dart`
  # hands to SetInformationJobObject. Chosen over adding a C++ plugin under
  # `windows/runner/` for the same five kernel32 calls: no build-system change,
  # nothing to keep in sync with the Flutter template, and the whole boundary
  # stays in one analysable, testable Dart file. Already in the lockfile as a
  # transitive dependency of pdfrx; declared here because we import it.
  ffi: ^2.1.3
  http_parser: ^4.1.2

  # PDF viewer for the 添削レビュー画面 (Issue #21, simplified-design-spec.md
  # §13/§15). Wraps pdfium -- the same rendering engine PoC 3
  # (docs/poc-3-pdf-coordinates.md) verified 0..1 normalized coordinates
  # round-trip against, so overlay placement uses the same coordinate basis
  # pdfrx renders pages in.
  pdfrx: ^2.4.7

  # State management and DI (docs/technology-stack.md §2). Every screen reads
  # its collaborators from `core/app_dependencies.dart`'s provider instead of
  # taking them through constructors, and widget tests swap them with
  # `ProviderScope(overrides: ...)` -- see `test/app_harness.dart`.
  #
  # 3.3.2, not the newest 3.4.x: 3.4.1+ requires Dart >= 3.12 and this app is
  # pinned to 3.11.1 (`.fvmrc`). Note that `riverpod` 3.x declares `test` as a
  # regular dependency, which is why the lockfile grew a `test`/`shelf` subtree
  # that nothing in `lib/` imports.
  flutter_riverpod: ^3.3.2

  # Declarative routing (docs/technology-stack.md §2). The route table is
  # `lib/app_router.dart`; the paths features push to are `core/app_routes.dart`.
  #
  # 17.x, not 18.x: 18.0.0 requires Dart >= 3.12 (see above).
  go_router: ^17.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Only used directly by widget tests to build BuiltList-typed fields
  # (e.g. DependencyGraphResponse.layers) on the generated auto_scoring_api
  # models -- version pinned to match that package's own dependency.
  built_collection: '>=5.1.1 <6.0.0'

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # The font's licence, shipped as an asset because SIL OFL 1.1 requires the
  # licence and copyright notice to travel with any redistribution of the font
  # -- and a Windows build redistributes it. docs/design-tokens.md §2.4.
  assets:
    - assets/fonts/OFL.txt

  # Bundled, not fetched at runtime (`google_fonts` needs the network on first
  # paint, and this app runs offline by design) and not left to whatever the OS
  # ships: the UI is almost entirely Japanese, so the font is a design token,
  # and dev (Linux) and target (Windows) have to render the same glyphs.
  # Why this family, and what was weighed against it: docs/design-tokens.md §2.
  #
  # One variable font file (100..900 on the `wght` axis) rather than one static
  # file per weight -- three static Noto Sans JP instances would be ~15 MB, this
  # is 9.6 MB and covers the whole axis. No `fontVariations` needed at the call
  # sites: Flutter maps `fontWeight` straight onto the axis, which
  # `test/app_typography_test.dart` measures against the real file.
  fonts:
    - family: Noto Sans JP
      fonts:
        - asset: assets/fonts/NotoSansJP-VariableFont_wght.ttf
