name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Cancelling an in-progress run is right on a PR branch (a superseded push
# means the old run's result is worthless) but wrong on `main`: two merges
# within a run's duration would cancel the first merge commit's own run,
# leaving that commit on `main` with no run that ever verified it -- and
# GitHub shows the cancelled run as neutral, not red, so `main` still looks
# green (Issue #180). `cancel-in-progress` itself is not the thing to drop;
# it is part of the CI-time cut from Issue #129 and stays correct for PRs.
#
# Issue #180 kept one shared group for every push to `main`
# (`ci-refs/heads/main`) and only turned `cancel-in-progress` off there, so
# consecutive merges queued and ran one after another instead of cancelling
# each other -- safe, but still serialised. Issue #199 removes that queueing
# too: `github.sha` is folded into the group for a `main` push, so every
# commit gets its own group and no run ever shares a group with another
# main run to queue behind. Two merges landing close together are therefore
# verified by two runs racing in parallel -- an accepted side effect (owner
# decision), not something this workflow tries to serialise with a queue.
#
# For a `push` to `main`, `github.ref` is `refs/heads/main`; for a
# `pull_request` run it is `refs/pull/<number>/merge`, not the head branch
# name -- confirmed from this repo's own run logs (checkout step), not
# assumed: a main-push run's Checkout step ran
# `checkout ... -B main refs/remotes/origin/main` (run 34474222375), and a
# pull_request run's Checkout step ran
# `checkout ... refs/remotes/pull/<number>/merge` (run 34472340931). This
# workflow only triggers on `pull_request` and `push: branches: [main]`, so
# those are the only two cases the expression below has to tell apart.
#
# `A && B || C` is short-circuit evaluation, not a ternary: GitHub Actions
# returns whichever operand decided the result, not a coerced boolean (same
# behaviour as JavaScript), so if `B` were falsy the expression would fall
# through to `C` even when `A` is true. That is safe here only because `B`
# (`format('ci-main-{0}', github.sha)`) is a `format()` call with a fixed
# non-empty prefix, so it is always truthy regardless of `github.sha`.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.sha) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # `pnpm test` ran `test:app && test:backend` back to back, so the two halves
  # -- 7.9 and 7.7 minutes on this runner -- were serial for no reason other
  # than living in one job (Issue #129). They are split here so the wall clock
  # is the longer of the two rather than their sum. Everything else is placed
  # by which toolchain it needs, so neither job installs one it does not use.
  app:
    name: App
    # Runs on Windows so `build:app` can produce the Flutter Windows debug
    # build (needs Visual Studio, present on GitHub-hosted windows runners).
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Template ships with tag refs for readability. Pin to a full commit SHA
      # before you rely on CI as a merge gate.
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      # Enable pnpm through Corepack (bundled with Node). It reads the
      # packageManager field in package.json and provisions that exact version
      # instantly, avoiding pnpm/action-setup's npm self-installer
      # ("Running self-installer..."), which is slow on a cold cache and
      # depends on the npm registry. Must run after setup-node.
      - name: Enable pnpm
        run: corepack enable
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true
      # `openapi:check` exports the schema from the FastAPI app before it
      # regenerates the Dart client, so this job needs Python too.
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.7"
          enable-cache: true
      - name: Install Node dependencies
        # `--filter` on the root package: `desktop/` is a workspace package
        # (pnpm-workspace.yaml) and nothing in this job runs it, so there is no
        # reason to spend a minute downloading the Electron binary here.
        run: pnpm install --frozen-lockfile --filter auto-scoring
      - name: Restore Flutter packages
        run: flutter pub get
        working-directory: app
      - name: Restore Python environment
        run: uv sync --locked
        working-directory: backend
      # Repository-wide gates. Prettier covers both stacks and the skill
      # mirror is not stack-specific, so they run once, here, rather than
      # being duplicated into the backend job.
      - name: Check agent skill mirrors
        run: pnpm skills:check
      - name: Check formatting
        run: pnpm format:check
      - name: OpenAPI contract self-test
        # Fast, dependency-free unit test for the atomic generate/swap helper
        # (Issue #102) -- separate from "OpenAPI contract" below so a broken
        # helper is reported before spending time on a full regenerate.
        run: pnpm openapi:selftest
      - name: OpenAPI contract
        # Regenerates the schema + Dart client and fails on any drift. Needs
        # uv, dart, and Java (openapi-generator) -- all present on the runner.
        # Kept in this job because `dart` only exists where the Flutter SDK
        # was restored; running it in the backend job would mean restoring
        # that 1.7 GB SDK a second time to save nothing.
        run: pnpm openapi:check
      - name: Lint
        run: pnpm lint:app
      - name: Typecheck
        run: pnpm typecheck:app
      - name: Test
        run: pnpm test:app
      - name: Build
        run: pnpm build:app

  backend:
    name: Backend
    # Windows like the job it was split out of: this is a Windows-only
    # product, and the sidecar's path and file-I/O behaviour is exactly the
    # kind of thing that passes on Linux and fails on the machine a teacher
    # actually runs. Moving these tests to a faster Linux runner would cut
    # the job roughly threefold and quietly stop testing the platform we
    # ship on, so it is not done here.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Enable pnpm
        run: corepack enable
      # Deliberately no Setup Flutter and no `pnpm install`: nothing below
      # touches dart or a node dependency, and skipping the Flutter SDK
      # restore alone takes ~1.6 minutes off this job -- the one that now
      # decides the wall clock.
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.7"
          enable-cache: true
      - name: Restore Python environment
        run: uv sync --locked
        working-directory: backend
      - name: Lint
        run: pnpm lint:backend
      - name: Typecheck
        run: pnpm typecheck:backend
      - name: Test
        run: pnpm test:backend
      - name: Build
        run: pnpm build:backend

  desktop:
    name: Desktop
    # Windows for the same reason as the two jobs above: this is a Windows-only
    # product, and an Electron shell is exactly where a path, a spawn or a
    # window that behaves differently per platform hides. The Playwright test
    # below launches a real Electron window, which GitHub's Windows runners
    # support without an X server stand-in.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Enable pnpm
        run: corepack enable
      # Deliberately no Flutter SDK and no uv: nothing here touches dart or
      # Python. `--filter` keeps this to `desktop/`'s own dependency tree, the
      # mirror image of the app/backend jobs skipping the Electron binary.
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile --filter @auto-scoring/desktop
      - name: Typecheck
        run: pnpm typecheck:desktop
      - name: Test
        # Vitest: the React Testing Library test and the dependency-direction
        # test (desktop/test/architecture.test.ts).
        run: pnpm test:desktop
      - name: Build
        run: pnpm build:desktop
      - name: End-to-end
        # Playwright launches the built Electron app and checks a window
        # actually appears (Issue #217 acceptance condition 1). No artifact is
        # uploaded on failure: `_electron.launch()` builds its own context, so
        # Playwright's `trace` and `screenshot` options do not apply to it, and
        # the report would hold nothing the `github` reporter has not already
        # annotated onto the failing step.
        run: pnpm test:desktop:e2e

  quality:
    name: Quality
    # The context main's ruleset requires, kept under its original name so
    # splitting the work above stays invisible to branch protection. It holds
    # the verdict for `app` + `backend` + `desktop`, which is exactly what the
    # single Quality job used to cover -- `package` was never a required check
    # and is not made into one here. A new job that is not in `needs` below is
    # a job whose failure cannot block a merge, so adding one means adding it
    # in both places.
    needs: [app, backend, desktop]
    # `if: always()` is load-bearing. Without it, a failing `needs` leaves
    # this job *skipped*, and GitHub counts a skipped required check as a
    # pass -- the build would be red while the merge gate showed green. The
    # same reason the results are asserted explicitly below: reaching this
    # step is not evidence that anything succeeded.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every quality job succeeded
        shell: bash
        run: |
          echo "app=${{ needs.app.result }}"
          echo "backend=${{ needs.backend.result }}"
          echo "desktop=${{ needs.desktop.result }}"
          failed=0
          for result in "${{ needs.app.result }}" "${{ needs.backend.result }}" "${{ needs.desktop.result }}"; do
            if [ "$result" != "success" ]; then failed=1; fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::A quality job did not succeed."
            exit 1
          fi
          echo "All quality jobs succeeded."

  package:
    name: Package (Windows)
    # The only place the Windows artifacts can be built or verified at all:
    # PyInstaller cannot cross-compile, so a Windows sidecar bundle has to be
    # produced on Windows (Issue #24).
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Enable pnpm
        run: corepack enable
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.7"
          enable-cache: true
      - name: Install Node dependencies
        # `--filter` on the root package: `desktop/` is a workspace package
        # (pnpm-workspace.yaml) and nothing in this job runs it, so there is no
        # reason to spend a minute downloading the Electron binary here.
        run: pnpm install --frozen-lockfile --filter auto-scoring
      - name: Restore Flutter packages
        run: flutter pub get
        working-directory: app
      - name: Restore Python environment
        run: uv sync --locked
        working-directory: backend

      - name: Bundle the Python sidecar (PyInstaller onedir)
        run: pnpm run package:sidecar

      # The step this job exists for. A missing hidden import, data file or
      # native library cannot fail the PyInstaller build -- only running the
      # frozen executable finds it. Boots the bundle, drives a real handshake,
      # /healthz, an authenticated and an unauthenticated call, then kills it
      # and checks nothing is left holding the port.
      - name: Smoke-test the packaged sidecar
        run: pnpm run package:sidecar:smoke

      - name: Build the Flutter Windows release
        run: flutter build windows --release
        working-directory: app

      - name: Build the unsigned installer
        run: pnpm run package:installer

      # Unsigned, and named so. Installing it shows a SmartScreen warning;
      # signing is a human-only step performed on this artifact outside CI
      # (docs/windows-distribution.md §8). No certificate or key exists in
      # this repository or in CI secrets.
      - name: Upload the unsigned installer
        uses: actions/upload-artifact@v4
        with:
          name: auto-scoring-installer-unsigned
          path: installer/output/*.exe
          if-no-files-found: error

      # The bundle on its own, for reproducing a sidecar-only problem on a
      # clean VM without running the installer.
      - name: Upload the sidecar bundle
        uses: actions/upload-artifact@v4
        with:
          name: auto-scoring-sidecar-bundle
          path: backend/dist/auto-scoring-sidecar/
          if-no-files-found: error
