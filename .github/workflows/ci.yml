name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    # Runs on Windows so `pnpm build` can produce the Flutter Windows debug
    # build (needs Visual Studio, present on GitHub-hosted windows runners).
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Template ships with tag refs for readability. Pin to a full commit SHA
      # before you rely on CI as a merge gate.
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      # Enable pnpm through Corepack (bundled with Node). It reads the
      # packageManager field in package.json and provisions that exact version
      # instantly, avoiding pnpm/action-setup's npm self-installer
      # ("Running self-installer..."), which is slow on a cold cache and
      # depends on the npm registry. Must run after setup-node.
      - name: Enable pnpm
        run: corepack enable
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.7"
          enable-cache: true
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore Flutter packages
        run: flutter pub get
        working-directory: app
      - name: Restore Python environment
        run: uv sync --locked
        working-directory: backend
      # TEMPORARY (Issue #57): is anything left alive and serving after the
      # supervisor's kill? Remove once the question is answered.
      - name: Diagnose the venv sidecar's process tree
        run: |
          1..3 | ForEach-Object {
            Write-Host "--- run $_ ---"
            pwsh -NoProfile -File scripts/diagnose-sidecar-process-tree.ps1 `
              -SidecarPath backend/.venv/Scripts/auto-scoring-sidecar.exe
          }

      - name: Check agent skill mirrors
        run: pnpm skills:check
      - name: Check formatting
        run: pnpm format:check
      - name: OpenAPI contract
        # Regenerates the schema + Dart client and fails on any drift. Needs
        # uv, dart, and Java (openapi-generator) — all present on the runner.
        run: pnpm openapi:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  package:
    name: Package (Windows)
    # The only place the Windows artifacts can be built or verified at all:
    # PyInstaller cannot cross-compile, so a Windows sidecar bundle has to be
    # produced on Windows (Issue #24).
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Enable pnpm
        run: corepack enable
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.7"
          enable-cache: true
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore Flutter packages
        run: flutter pub get
        working-directory: app
      - name: Restore Python environment
        run: uv sync --locked
        working-directory: backend

      - name: Bundle the Python sidecar (PyInstaller onedir)
        run: pnpm run package:sidecar

      # TEMPORARY (Issue #57): the same measurement against what a user
      # actually runs, to tell a product problem from a test-harness one.
      - name: Diagnose the packaged sidecar's process tree
        run: |
          1..3 | ForEach-Object {
            Write-Host "--- run $_ ---"
            pwsh -NoProfile -File scripts/diagnose-sidecar-process-tree.ps1 `
              -SidecarPath backend/dist/auto-scoring-sidecar/auto-scoring-sidecar.exe
          }

      # The step this job exists for. A missing hidden import, data file or
      # native library cannot fail the PyInstaller build -- only running the
      # frozen executable finds it. Boots the bundle, drives a real handshake,
      # /healthz, an authenticated and an unauthenticated call, then kills it
      # and checks nothing is left holding the port.
      - name: Smoke-test the packaged sidecar
        run: pnpm run package:sidecar:smoke

      - name: Build the Flutter Windows release
        run: flutter build windows --release
        working-directory: app

      - name: Build the unsigned installer
        run: pnpm run package:installer

      # Unsigned, and named so. Installing it shows a SmartScreen warning;
      # signing is a human-only step performed on this artifact outside CI
      # (docs/windows-distribution.md §8). No certificate or key exists in
      # this repository or in CI secrets.
      - name: Upload the unsigned installer
        uses: actions/upload-artifact@v4
        with:
          name: auto-scoring-installer-unsigned
          path: installer/output/*.exe
          if-no-files-found: error

      # The bundle on its own, for reproducing a sidecar-only problem on a
      # clean VM without running the installer.
      - name: Upload the sidecar bundle
        uses: actions/upload-artifact@v4
        with:
          name: auto-scoring-sidecar-bundle
          path: backend/dist/auto-scoring-sidecar/
          if-no-files-found: error

  # TEMPORARY (Issue #57): the shutdown assertion in
  # `sidecar_supervisor_integration_test.dart` fails intermittently on this
  # runner and nowhere else, so the only way to learn what is actually alive at
  # that moment is to run it many times until it fails and let the test print
  # its own evidence. Six legs in parallel, each looping until the first
  # failure. Remove once the cause is settled.
  flake-hunt:
    name: Flake hunt (Windows)
    # DISABLED. Six Windows legs x up to 12 runs is expensive, and Windows
    # minutes bill at 2x -- it took the account close to its Actions limit.
    # Do not re-enable without agreeing the budget first; when re-enabling,
    # start from one leg, not six.
    if: false
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        leg: [1]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.7"
          enable-cache: true
      - name: Restore Flutter packages
        run: flutter pub get
        working-directory: app
      - name: Restore Python environment
        run: uv sync --locked
        working-directory: backend
      - name: Run the sidecar suite until it fails
        working-directory: app
        run: |
          for ($i = 1; $i -le 12; $i++) {
            Write-Host "=== leg ${{ matrix.leg }} iteration $i ==="
            flutter test -t sidecar
            if ($LASTEXITCODE -ne 0) {
              Write-Host "reproduced on iteration $i"
              exit 1
            }
          }
