name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    # Runs on Windows so `pnpm build` can produce the Flutter Windows debug
    # build (needs Visual Studio, present on GitHub-hosted windows runners).
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Template ships with tag refs for readability. Pin to a full commit SHA
      # before you rely on CI as a merge gate.
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      # Enable pnpm through Corepack (bundled with Node). It reads the
      # packageManager field in package.json and provisions that exact version
      # instantly, avoiding pnpm/action-setup's npm self-installer
      # ("Running self-installer..."), which is slow on a cold cache and
      # depends on the npm registry. Must run after setup-node.
      - name: Enable pnpm
        run: corepack enable
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.7"
          enable-cache: true
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore Flutter packages
        run: flutter pub get
        working-directory: app
      - name: Restore Python environment
        run: uv sync --locked
        working-directory: backend
      - name: Check agent skill mirrors
        run: pnpm skills:check
      - name: Check formatting
        run: pnpm format:check
      - name: OpenAPI contract
        # Regenerates the schema + Dart client and fails on any drift. Needs
        # uv, dart, and Java (openapi-generator) — all present on the runner.
        run: pnpm openapi:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
